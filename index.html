<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>真分數 × 真分數 圖示器</title>
<style>
  :root{
    --blue:#2563eb;
    --red:#dc2626;
    --purple:#7c3aed;
    --ink:#0f172a;
    --muted:#64748b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:30px 16px 60px;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(1100px 550px at 8% -12%, #dbeafe, transparent 65%),
      radial-gradient(900px 500px at 105% 5%, #fce7f3, transparent 60%),
      #f8fafc;
  }
  .app{width:100%;max-width:760px;}

  /* ============ 分數基本樣式（上下書寫） ============ */
  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
    margin:0;
    font-weight:800;
    font-size:1em;
    color:inherit;
    flex:0 0 auto;
  }
  .frac .num{
    padding:0 5px 1px;
    border-bottom:1.8px solid currentColor;
    text-align:center;
    min-width:1.15em;
    line-height:1;
  }
  .frac .den{
    padding:1px 5px 0;
    text-align:center;
    min-width:1.15em;
    line-height:1;
  }

  /* ============ 算式 flex 行 ============ */
  .expr-line{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    line-height:1;
  }
  .expr-line > span{line-height:1;white-space:nowrap;}

  /* ============ 標題 ============ */
  h1{font-size:clamp(22px,3.6vw,30px);margin:0 0 8px;letter-spacing:.5px;text-align:center;}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px;line-height:1.9;text-align:center;}
  .sub b{color:var(--purple);}

  .card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px -12px rgba(15,23,42,.18), 0 2px 6px -2px rgba(15,23,42,.06);
    border:1px solid rgba(148,163,184,.22);
  }

  /* ============ 題目 + 答案同一行 ============ */
  .expr-card{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:28px 18px;margin-bottom:16px;
  }
  .question-row{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(8px,2.2vw,20px);flex-wrap:wrap;
  }

  .frac-input{display:flex;flex-direction:column;align-items:center;}

  .frac-input input{
    width:60px;height:44px;text-align:center;
    font-size:21px;font-weight:800;color:var(--ink);
    border:2px solid #cbd5e1;border-radius:12px;background:#fff;
    outline:none;transition:.15s;
    -moz-appearance:textfield;
  }
  .frac-input input::-webkit-outer-spin-button,
  .frac-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .frac-input input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18);}
  .frac-input input::placeholder{color:#cbd5e1;font-weight:600;}
  .frac-input .line{width:66px;height:3.5px;background:var(--ink);border-radius:2px;margin:4px 0;}

  .frac-input.ans input{
    background:#f5f3ff;
    border-color:#c4b5fd;
    color:#5b21b6;
  }
  .frac-input.ans input::placeholder{color:#c4b5fd;}
  .frac-input.ans input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.2);}
  .frac-input.ans .line{background:var(--purple);}

  .op{font-size:30px;font-weight:700;color:#64748b;line-height:1;}

  /* ============ 按鈕 ============ */
  .actions{display:flex;gap:12px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:12px;padding:12px 28px;
    font-size:16px;font-weight:800;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .btn-primary{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    box-shadow:0 6px 16px -6px rgba(99,102,241,.7);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 20px -8px rgba(99,102,241,.8);}
  .btn-primary:active{transform:translateY(0);}
  .btn-ghost{background:#eef2ff;color:#4338ca;}
  .btn-ghost:hover{background:#e0e7ff;}

  /* ============ 回饋 ============ */
  .feedback{
    display:none;margin:0 0 18px;padding:14px 18px;border-radius:13px;
    font-weight:700;font-size:15px;line-height:1.8;
    text-align:center;
  }
  .feedback.show{display:block;animation:pop .22s ease;}
  @keyframes pop{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
  .feedback.ok{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
  .feedback.err{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}
  .feedback.warn{background:#fef3c7;color:#b45309;border:1px solid #fcd34d;}
  .feedback b{font-weight:900;}
  .fb-expr{
    margin-top:10px;padding-top:10px;
    border-top:1px dashed rgba(15,23,42,.15);
    font-size:16px;
  }
  .fb-expr .frac{font-size:1.05em;}

  /* ============ 圖示區 ============ */
  .fig-card{display:flex;flex-direction:column;gap:10px;margin:0 auto;}
  .legend{
    display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
    font-size:13px;color:#475569;margin-top:8px;
  }
  .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;}
  .sw.blue{background:rgba(37,99,235,.35);border:1.5px solid var(--blue);}
  .sw.red{background:rgba(220,38,38,.35);border:1.5px solid var(--red);}
  .sw.purple{background:rgba(124,58,237,.45);border:1.5px solid var(--purple);}

  .stage-title{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:14px;
    font-weight:700;
    color:#475569;
    margin:8px 0 6px;
    line-height:1.2;
    text-align:center;
  }
  .stage-title b{color:#6d28d9;}
  .stage-title .frac{font-size:1.1em;}
  .stage-title .circled{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:#ede9fe;color:#6d28d9;
    font-size:12px;font-weight:900;flex:0 0 auto;
  }
  .stage{margin:0;}

  /* 合併條：裡面的分數也使用上下書寫 */
  .merge-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:14px 0 4px;
    padding:12px 8px;
    font-size:15px;
    font-weight:800;
    color:#8b5cf6;
    border-top:1px dashed #ddd6fe;
    border-bottom:1px dashed #ddd6fe;
    animation:fadeIn .4s ease both;
  }
  .merge-bar .frac{font-size:1.05em;}
  .merge-bar .arrow{
    display:inline-block;font-size:17px;line-height:1;
    animation:bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .hint-box{
    text-align:center;font-size:13.5px;color:#94a3b8;
    background:#f8fafc;border:1px dashed #cbd5e1;
    border-radius:12px;padding:20px 16px;margin-top:14px;
    font-weight:600;line-height:1.8;
    animation:fadeIn .3s ease both;
  }
  .hint-box b{color:#a78bfa;}

  .answer-line{
    display:none;
    background:#f5f3ff;border:1px solid #ddd6fe;
    border-radius:12px;
    padding:16px 18px;
    margin:14px auto 0;
    max-width:100%;
    font-size:16px;
    font-weight:800;
    color:#4c1d95;
  }
  .answer-line.show{display:block;animation:pop .3s ease .35s both;}
  .answer-line .frac{font-size:1.12em;}

  /* ============ 重疊小格動畫 ============ */
  @keyframes cellIn{
    0%{opacity:0;transform:scale(.3);}
    70%{opacity:1;transform:scale(1.12);}
    100%{opacity:1;transform:scale(1);}
  }
  .cell{
    transform-box:fill-box;transform-origin:center;
    animation:cellIn .38s cubic-bezier(.34,1.56,.64,1) both;
  }

  @media (max-width:560px){
    .frac-input input{width:50px;height:38px;font-size:18px;}
    .frac-input .line{width:56px;height:3px;}
    .op{font-size:24px;}
    .merge-bar{font-size:13.5px;gap:6px;}
  }
</style>
</head>
<body>
<div class="app">
  <h1>真分數 × 真分數 圖示器</h1>
  <p class="sub">
    輸入兩個真分數（分子小於分母）。<b>橫向塗色</b>表示第一個分數，<b>縱向塗色</b>表示第二個分數；<br>
    兩者<b>重疊的紫色小格</b>就是乘積。填上答案並按「檢查答案」，答對時重疊小格會以<b>動畫</b>逐格填滿。
  </p>

  <!-- 題目 + 答案：同一行 -->
  <div class="card expr-card">
    <div class="question-row">
      <div class="frac-input">
        <input id="a" type="number" min="1" max="11" inputmode="numeric" placeholder="?" aria-label="第一個分數的分子">
        <div class="line"></div>
        <input id="b" type="number" min="2" max="12" inputmode="numeric" placeholder="?" aria-label="第一個分數的分母">
      </div>
      <div class="op">×</div>
      <div class="frac-input">
        <input id="c" type="number" min="1" max="11" inputmode="numeric" placeholder="?" aria-label="第二個分數的分子">
        <div class="line"></div>
        <input id="d" type="number" min="2" max="12" inputmode="numeric" placeholder="?" aria-label="第二個分數的分母">
      </div>
      <div class="op">=</div>
      <div class="frac-input ans">
        <input id="ansN" type="number" min="1" max="999" inputmode="numeric" placeholder="?" aria-label="答案的分子">
        <div class="line"></div>
        <input id="ansD" type="number" min="1" max="999" inputmode="numeric" placeholder="?" aria-label="答案的分母">
      </div>
    </div>
  </div>

  <!-- 操作按鈕 -->
  <div class="actions">
    <button id="checkBtn" class="btn btn-primary" type="button">檢查答案</button>
    <button id="resetBtn" class="btn btn-ghost" type="button">重設</button>
  </div>

  <!-- 回饋 -->
  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

  <!-- 圖示區 -->
  <div class="card fig-card">
    <div id="figure"></div>
    <div id="answerLine" class="answer-line"></div>
    <div class="legend">
      <span><i class="sw blue"></i>橫向塗色：第一個分數</span>
      <span><i class="sw red"></i>縱向塗色：第二個分數</span>
      <span><i class="sw purple"></i>重疊 = 乘積</span>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  const aEl=$('a'), bEl=$('b'), cEl=$('c'), dEl=$('d');
  const ansN=$('ansN'), ansD=$('ansD');
  const figure=$('figure'), fb=$('feedback');
  const checkBtn=$('checkBtn'), resetBtn=$('resetBtn');
  const answerLine=$('answerLine');

  const MAXNUM = 11;
  const MAXDEN = 12;
  let solved = false;

  const FONT = "'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif";

  const gcd = (x, y) => y ? gcd(y, x % y) : x;

  /* ============ 讀取數值 ============ */
  function readInt(el, min, max){
    const raw = el.value.trim();
    if (raw === '') return null;
    const v = parseInt(raw, 10);
    if (!Number.isFinite(v) || v < min) return null;
    return Math.min(v, max);
  }

  function getTopic(){
    let a = readInt(aEl, 1, MAXNUM);
    let b = readInt(bEl, 2, MAXDEN);
    let c = readInt(cEl, 1, MAXNUM);
    let d = readInt(dEl, 2, MAXDEN);
    if (a === null || b === null || c === null || d === null) return null;
    a = Math.min(a, b - 1);
    c = Math.min(c, d - 1);
    if (a < 1 || c < 1) return null;
    return { a, b, c, d };
  }

  function normalizeTopicInputs(){
    let a = parseInt(aEl.value, 10);
    let b = parseInt(bEl.value, 10);
    let c = parseInt(cEl.value, 10);
    let d = parseInt(dEl.value, 10);

    if (Number.isFinite(b)) { b = Math.max(2, Math.min(MAXDEN, b)); bEl.value = b; }
    if (Number.isFinite(a)) {
      a = Math.max(1, Math.min(MAXNUM, a));
      if (Number.isFinite(b)) a = Math.min(a, b - 1);
      aEl.value = a;
    }
    if (Number.isFinite(d)) { d = Math.max(2, Math.min(MAXDEN, d)); dEl.value = d; }
    if (Number.isFinite(c)) {
      c = Math.max(1, Math.min(MAXNUM, c));
      if (Number.isFinite(d)) c = Math.min(c, d - 1);
      cEl.value = c;
    }
  }

  /* ============ HTML 分數（上下書寫） ============ */
  function htmlFraction(num, den){
    return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
  }
  function opSpan(s){ return `<span>${s}</span>`; }

  function buildExprLine(parts){
    return `<div class="expr-line">${parts.join('')}</div>`;
  }

  /* ============ SVG 分數（上下書寫，用於圖內標籤） ============ */
  function svgFraction(cx, cy, num, den, color, fontSize){
    const fs = fontSize;
    const gap = fs * 0.72;
    const numStr = String(num), denStr = String(den);
    const maxLen = Math.max(numStr.length, denStr.length);
    const lineHalf = Math.max(fs * 0.6, maxLen * fs * 0.34);
    const strokeW = Math.max(1.4, fs * 0.11);

    let out = '';
    out += `<text x="${cx.toFixed(1)}" y="${(cy - gap).toFixed(1)}"
              text-anchor="middle" dominant-baseline="central"
              font-size="${fs.toFixed(1)}" font-weight="800" fill="${color}"
              font-family="${FONT}">${numStr}</text>`;
    out += `<line x1="${(cx - lineHalf).toFixed(1)}" y1="${cy.toFixed(1)}"
              x2="${(cx + lineHalf).toFixed(1)}" y2="${cy.toFixed(1)}"
              stroke="${color}" stroke-width="${strokeW.toFixed(2)}" stroke-linecap="round"/>`;
    out += `<text x="${cx.toFixed(1)}" y="${(cy + gap).toFixed(1)}"
              text-anchor="middle" dominant-baseline="central"
              font-size="${fs.toFixed(1)}" font-weight="800" fill="${color}"
              font-family="${FONT}">${denStr}</text>`;
    return out;
  }

  /* ============ 回饋訊息 ============ */
  function showFB(type, text, exprParts){
    let html = '';
    if (text) html += `<div>${text}</div>`;
    if (exprParts && exprParts.length){
      html += `<div class="fb-expr">${buildExprLine(exprParts)}</div>`;
    }
    fb.className = 'feedback show ' + type;
    fb.innerHTML = html;
  }
  function hideFB(){
    fb.className = 'feedback';
    fb.innerHTML = '';
  }

  /* ============ 空白圖板 ============ */
  function blankHTML(){
    const S = 340;
    return `<svg viewBox="-10 -10 ${S + 20} ${S + 20}" width="100%"
              style="display:block;max-width:400px;margin:0 auto" role="img"
              aria-label="尚未輸入分數">
      <rect x="0" y="0" width="${S}" height="${S}" rx="8"
            fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="9 7"/>
      <text x="${S/2}" y="${S/2 - 12}" text-anchor="middle"
            font-size="18" font-weight="700" fill="#94a3b8"
            font-family="${FONT}">請輸入兩個真分數</text>
      <text x="${S/2}" y="${S/2 + 18}" text-anchor="middle"
            font-size="14" font-weight="500" fill="#cbd5e1"
            font-family="${FONT}">圖示會在這裡出現</text>
    </svg>`;
  }

  /* ============ 面積模型圖 ============ */
  function buildAreaSVG(a, b, c, d, animate){
    const S = 340;
    const cellW = S / b;
    const cellH = S / d;
    const blueW = a * cellW;
    const redH = c * cellH;

    const vbW = S + 95;
    const vbH = S + 65;

    let svg = `<svg viewBox="-10 -10 ${vbW} ${vbH}" width="100%"
                 style="display:block;max-width:430px;margin:0 auto"
                 role="img" aria-label="真分數乘真分數的面積模型：重疊區就是乘積">`;

    // 白底
    svg += `<rect x="0" y="0" width="${S}" height="${S}" fill="#ffffff"/>`;

    // 藍：橫向 a 欄
    svg += `<rect x="0" y="0" width="${blueW.toFixed(1)}" height="${S}"
              fill="#2563eb" opacity="0.28"/>`;

    // 紅：縱向 c 列
    svg += `<rect x="0" y="0" width="${S}" height="${redH.toFixed(1)}"
              fill="#dc2626" opacity="0.28"/>`;

    // 重疊區
    if (animate){
      let idx = 0;
      const total = a * c;
      const step = Math.min(0.055, 2.0 / Math.max(total, 1));
      for (let j = 0; j < c; j++){
        for (let i = 0; i < a; i++){
          const x = i * cellW;
          const y = j * cellH;
          const delay = (idx * step).toFixed(3);
          svg += `<rect class="cell" x="${x.toFixed(2)}" y="${y.toFixed(2)}"
                    width="${cellW.toFixed(2)}" height="${cellH.toFixed(2)}"
                    fill="#7c3aed" fill-opacity="0.55"
                    style="animation-delay:${delay}s"/>`;
          idx++;
        }
      }
    } else {
      svg += `<rect x="0" y="0" width="${blueW.toFixed(1)}" height="${redH.toFixed(1)}"
                fill="#7c3aed" opacity="0.16"/>`;
    }

    // 格線
    svg += `<g stroke="#475569" stroke-width="1" opacity="0.45">`;
    for (let i = 1; i < b; i++){
      const x = (i * cellW).toFixed(2);
      svg += `<line x1="${x}" y1="0" x2="${x}" y2="${S}"/>`;
    }
    for (let j = 1; j < d; j++){
      const y = (j * cellH).toFixed(2);
      svg += `<line x1="0" y1="${y}" x2="${S}" y2="${y}"/>`;
    }
    svg += `</g>`;

    // 重疊區外框
    if (animate){
      svg += `<rect x="0" y="0" width="${blueW.toFixed(1)}" height="${redH.toFixed(1)}"
                fill="none" stroke="#7c3aed" stroke-width="3"/>`;
    } else {
      svg += `<rect x="0" y="0" width="${blueW.toFixed(1)}" height="${redH.toFixed(1)}"
                fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5"/>`;
    }

    // 正方形外框
    svg += `<rect x="0" y="0" width="${S}" height="${S}"
              fill="none" stroke="#0f172a" stroke-width="2.5"/>`;

    // 下方標籤 a/b（藍，上下書寫）
    svg += svgFraction(S / 2, S + 30, a, b, '#1d4ed8', 17);

    // 右側標籤 c/d（紅，上下書寫）
    svg += svgFraction(S + 42, S / 2, c, d, '#b91c1c', 17);

    svg += `</svg>`;
    return svg;
  }

  /* ============ 繪圖主控 ============ */
  function render(){
    const t = getTopic();
    answerLine.className = 'answer-line';
    answerLine.innerHTML = '';

    if (!t){
      figure.innerHTML = blankHTML();
      return;
    }

    const { a, b, c, d } = t;
    const p = a * c, q = b * d;
    const g = gcd(p, q);
    const rp = p / g, rq = q / g;

    let html = '';

    /* 階段一：說明目前塗色狀況 */
    if (solved){
      html += `<div class="stage-title">
        <span class="circled">✓</span>
        <span>重疊區共有</span>
        <span><b>${p}</b></span>
        <span>個小格（全部</span>
        <span><b>${q}</b></span>
        <span>格）</span>
      </div>`;
    } else {
      html += `<div class="stage-title">
        <span>橫向塗</span>
        ${htmlFraction(a, b)}
        <span>，縱向塗</span>
        ${htmlFraction(c, d)}
        <span>，重疊區就是答案</span>
      </div>`;
    }

    html += `<div class="stage">${buildAreaSVG(a, b, c, d, solved)}</div>`;

    /* 合併條：全部使用上下分數 */
    if (solved){
      html += `<div class="merge-bar">
        <span class="arrow">↓</span>
        <span>重疊 =</span>
        ${htmlFraction(a, b)}
        <span>×</span>
        ${htmlFraction(c, d)}
        <span>=</span>
        ${htmlFraction(p, q)}
      </div>`;
    } else {
      html += `<div class="hint-box">
        填上你的答案後，按「檢查答案」。<br>
        答對時，重疊的小格會以<b>動畫</b>逐格填滿。
      </div>`;
    }

    figure.innerHTML = html;

    /* 答對後在圖下方顯示完整算式（同樣上下分數） */
    if (solved){
      const parts = [];
      parts.push(htmlFraction(a, b));
      parts.push(opSpan('×'));
      parts.push(htmlFraction(c, d));
      parts.push(opSpan('='));
      parts.push(htmlFraction(p, q));
      if (g > 1){
        parts.push(opSpan('='));
        parts.push(htmlFraction(rp, rq));
      }
      answerLine.innerHTML = buildExprLine(parts);
      answerLine.classList.add('show');
    }
  }

  /* ============ 檢查答案 ============ */
  function check(){
    const t = getTopic();
    if (!t){
      showFB('err', '請先輸入兩個完整的真分數（分子小於分母）。');
      return;
    }

    const an = readInt(ansN, 1, 999);
    const ad = readInt(ansD, 1, 999);
    if (an === null || ad === null){
      showFB('err', '請在等號右邊輸入你的答案（分子和分母都要填，且為正整數）。');
      return;
    }

    const { a, b, c, d } = t;
    const p = a * c, q = b * d;
    const g = gcd(p, q);
    const rp = p / g, rq = q / g;

    const equal   = (an * q === ad * p);
    const reduced = (gcd(an, ad) === 1);

    if (equal && reduced){
      solved = true;
      /* 回饋訊息：文字 + 上下分數的算式 */
      showFB('ok', '✓ 正確！', [
        htmlFraction(a, b),
        opSpan('×'),
        htmlFraction(c, d),
        opSpan('='),
        htmlFraction(p, q),
        (g > 1) ? opSpan('=') : '',
        (g > 1) ? htmlFraction(rp, rq) : ''
      ]);
      render();
    } else if (equal && !reduced){
      solved = false;
      showFB('warn', '答案的數值正確，但還沒有約簡。請把答案約簡至最簡分數，再按一次「檢查答案」。');
      render();
    } else {
      solved = false;
      showFB('err', '✗ 答案不正確，請再試一次。<br>提示：分子 × 分子放上面，分母 × 分母放下面，再化為最簡。');
      render();
    }
  }

  /* ============ 重設 ============ */
  function reset(){
    [aEl, bEl, cEl, dEl, ansN, ansD].forEach(el => { el.value = ''; });
    solved = false;
    hideFB();
    render();
    aEl.focus();
  }

  /* ============ 事件 ============ */
  function bindTopic(el, max){
    el.addEventListener('input', () => {
      const v = parseInt(el.value, 10);
      if (Number.isFinite(v) && v > max) el.value = max;
      solved = false;
      hideFB();
      render();
    });
    el.addEventListener('change', () => { normalizeTopicInputs(); render(); });
    el.addEventListener('blur',   () => { normalizeTopicInputs(); render(); });
  }
  bindTopic(aEl, MAXNUM);
  bindTopic(bEl, MAXDEN);
  bindTopic(cEl, MAXNUM);
  bindTopic(dEl, MAXDEN);

  [ansN, ansD].forEach(el => {
    el.addEventListener('input', () => {
      const v = parseInt(el.value, 10);
      if (Number.isFinite(v) && v > 999) el.value = 999;
      solved = false;
      hideFB();
      render();
    });
  });

  checkBtn.addEventListener('click', check);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT'){
      e.preventDefault();
      check();
    }
  });

  /* ============ 初始化 ============ */
  render();
})();
</script>
</body>
</html>
